# `docker compose up --build`           -> db + api + web, UI on http://localhost:3000
# `docker compose up -d db`             -> only Postgres, for local development and the test suites (pnpm dev, pnpm test:int)
# Host ports can be moved with SENTINEL_DB_PORT / SENTINEL_API_PORT / SENTINEL_WEB_PORT (defaults 5433 / 4000 / 3000).
# Provider keys, LLM_PROVIDER and SENTINEL_AGENT_TOKEN are passed through from your shell or the root .env (see docs/setup-keys.md);
# with none of them everything but the AI runtime and the Agent API works.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: campaign_sentinel
      # local dev only: no password, port bound to 127.0.0.1
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${SENTINEL_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campaign_sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@db:5432/campaign_sentinel
      API_PORT: "4000"
      # inside the container the port is published to 127.0.0.1 only (see ports below)
      API_HOST: 0.0.0.0
      # CORS: the browser origin of the web app
      WEB_ORIGIN: http://localhost:${SENTINEL_WEB_PORT:-3000}
      SENTINEL_AGENT_TOKEN: ${SENTINEL_AGENT_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # the container has no Chromium: browser_check reports "unavailable"
      BROWSER_CHECKS: "off"
    ports:
      - "127.0.0.1:${SENTINEL_API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # what the BROWSER calls; the server-side calls use API_INTERNAL_URL below
        NEXT_PUBLIC_API_URL: http://localhost:${SENTINEL_API_PORT:-4000}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${SENTINEL_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  db-data:
